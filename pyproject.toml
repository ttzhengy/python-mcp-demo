[project]
name = "python-mcp-demo"
version = "0.1.0"
description = "A demonstration MCP (Model Context Protocol) server library built with FastMCP"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "ttzhengy", email = "303980015@qq.com" },
]
keywords = ["mcp", "model-context-protocol", "fastmcp", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastmcp>=0.6.0",
    "httpx>=0.28.0",
]

[project.urls]
homepage = "https://github.com/ttzhengy/python-mcp-demo"
repository = "https://github.com/ttzhengy/python-mcp-demo"
documentation = "https://github.com/ttzhengy/python-mcp-demo#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_mcp_demo"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
