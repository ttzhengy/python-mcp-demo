[project]
name = "python-mcp-demo"
version = "0.3.0"
description = "基于 FastMCP 的生产级 MCP 服务器库，内置 8 个实用工具 + Dify 工作流表单查询 POC"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "ttzhengy", email = "303980015@qq.com" },
]
keywords = ["mcp", "model-context-protocol", "fastmcp", "ai", "office", "dify"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastmcp>=0.6.0",
    "fastapi>=0.139.2",
    "uvicorn>=0.29",
    "httpx>=0.28.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "loguru>=0.7",
    "tenacity>=9.0",
]

[project.urls]
homepage = "https://github.com/ttzhengy/python-mcp-demo"
repository = "https://github.com/ttzhengy/python-mcp-demo"
documentation = "https://github.com/ttzhengy/python-mcp-demo#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_mcp_demo"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
